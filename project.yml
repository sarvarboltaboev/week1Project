name: Portfolio
options:
  bundleIdPrefix: com.sarvarboltaboev
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Portfolio:
    type: application
    platform: iOS
    sources: [Portfolio]
  PortfolioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PortfolioTests]
    dependencies:
      - target: Portfolio
schemes:
  Portfolio:
    build:
      targets:
        Portfolio: all
    test:
      targets: [PortfolioTests]
